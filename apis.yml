aid: rocketable
name: Rocketable
description: Rocketable acquires profitable SaaS products and infuses them with AI,
  operating a portfolio of software businesses that are run, improved, and grown by
  AI agents. Backed by Y Combinator, True Ventures, Bloomberg Beta, and INDIE.vc, the
  San Francisco company buys established SaaS products generating at least $500K in
  annual revenue and works toward support that resolves problems in seconds and features
  and fixes that ship in minutes or hours instead of quarters. The public site runs
  two intake flows — apply to join the team, and submit a SaaS product to be acquired —
  plus a newsletter on automating software businesses with AI agents. No public API
  or developer surface is published.
